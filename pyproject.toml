[project]
name = "warble"
version = "0.1.0"
description = "a small singing engine for diffsinger and classic utau voicebanks, built to be driven by an llm agent"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mido",
    "pykakasi",
    "pyphen",
    "setuptools<81",  # pyworld still imports pkg_resources
    "numpy",
    "pyyaml",
    "onnx",
    "onnxruntime",
    "soundfile",
    "scipy",
    "pyworld",
    "matplotlib",
    "pyloudnorm",
]

[project.optional-dependencies]
dev = ["pytest"]
asr = ["faster-whisper"]
plugins = ["pedalboard"]
mcp = ["mcp"]

[project.scripts]
warble = "warble.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["warble*"]

[tool.setuptools.package-data]
"warble.g2p" = ["data/*"]
"warble.utau.pz" = ["data/**/*"]
